<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<title>HEARSPACE 중계</title>
<link rel="stylesheet" href="screen.css">
<style>
  /* 앱 화면 배치·색은 screen.css(데모 페이지와 같이 씀) */
  html, body { margin: 0; height: 100%; background: #000000; color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  #chat { flex: 0 0 160px; border-top: 1px solid var(--outline); display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 12px; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
  #msgs .nick { color: var(--text2); }
  #msgs .sys { color: var(--text2); font-style: italic; }
  #form { display: flex; gap: 6px; padding: 6px 8px 8px; min-width: 0; }
  #form input, #form button { font: inherit; font-size: 16px; color: var(--text); background: #111111; border: 1px solid var(--outline); border-radius: 8px; padding: 8px; }
  #nick { width: 5em; flex: none; }
  #text { flex: 1 1 0; min-width: 0; width: 0; } /* 입력 칸 기본 폭(size 20)이 단추를 밀어내지 않게 */
  #form button { flex: none; background: #222222; padding: 8px 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <div id="title" hidden><span id="dot" hidden></span><span id="titleText"></span></div>
    <div id="sub" hidden></div>
    <div class="spacer"></div>
    <div id="guide"><canvas id="cv"></canvas></div>
    <div id="label" hidden></div>
    <div class="spacer"></div>
    <div id="hints"></div>
    <div id="notice" hidden></div>
  </div>
  <div id="chat">
    <div id="msgs" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="nick" placeholder="별명" aria-label="별명">
      <input id="text" placeholder="메시지 입력" aria-label="메시지">
      <button type="submit">보내기</button>
    </form>
  </div>
</div>
<pre id="test-out" hidden></pre>
<script src="screen.js"></script>
<script>
'use strict';
// 서버가 넣는 설정(relay.json): rate, clientBufferMs, clientMaxBufferMs, lostMs, chatMaxChars, nickMaxChars, chatKeep, clientStatsS
const S = /*SETTINGS*/null;
const Q = new URLSearchParams(location.search);
const K = Q.get('k') || '';
// Safari는 키보드가 열릴 때 viewport 설정을 따르지 않으므로 보이는 높이에 맞춘다
if (window.visualViewport) visualViewport.addEventListener('resize', () => { $('app').style.height = visualViewport.height + 'px'; });

// ---- 채팅 ----
let CID = '';
try { CID = crypto.randomUUID(); } catch (e) { CID = String(Math.random()).slice(2) + String(Date.now()); }
function addChat(m) {
  const box = $('msgs');
  const div = document.createElement('div');
  if (m.sys) { div.className = 'sys'; div.textContent = m.text; } else {
    const nick = document.createElement('span');
    nick.className = 'nick';
    nick.textContent = m.nick + ': ';
    div.append(nick, m.text); // 글자로만(HTML로 해석하지 않음)
  }
  box.append(div);
  while (box.childElementCount > S.chatKeep) box.firstElementChild.remove();
  box.scrollTop = box.scrollHeight;
}
$('nick').maxLength = S.nickMaxChars;
$('text').maxLength = S.chatMaxChars;
try { $('nick').value = localStorage.getItem('relayNick') || ''; } catch (e) {}
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nick = $('nick').value.trim(), text = $('text').value.trim();
  if (!nick) { $('nick').focus(); return; }
  if (!text) return;
  try { localStorage.setItem('relayNick', nick); } catch (e2) {}
  try {
    const r = await fetch('chat?k=' + encodeURIComponent(K), { method: 'POST', body: JSON.stringify({ client: CID, nick, text }) });
    if (r.status === 204) $('text').value = '';
    else addChat({ sys: true, text: r.status === 429 ? '1초에 한 번만 보낼 수 있어요' : '보내지 못했어요(' + r.status + ')' });
  } catch (e3) { addChat({ sys: true, text: '보내지 못했어요' }); }
});

// ---- 소리와 화면 맞추기 ----
let ctx = null, node = null, started = false, startFrame = 0, played = 0, stats = null;
let sseDown = false, audioDown = false;
const queue = []; // 서버 화면 사건(프레임 번호 순)

function onScreen(ev) {
  queue.push(ev);
  if (!started) queue.splice(0, queue.length - 1); // 소리를 켜기 전에는 마지막 하나만
  apply();
}
/** 지금 이어폰에 나오는 프레임 번호 이하의 마지막 화면을 그린다. */
function apply() {
  if (!started) return;
  if (sseDown || audioDown) { showLost(true); return; }
  const now = startFrame + played;
  while (queue.length > 1 && queue[1].frame <= now) queue.shift();
  const ev = queue[0];
  if (!ev || ev.frame > now) return;
  if (!ev.live || !ev.screen) { if (shown == null || shown.title !== '중계 끊김') showLost(false); return; }
  if (JSON.stringify(ev.screen) !== JSON.stringify(shown)) showApp(ev.screen);
}

async function start() {
  if (started) return;
  started = true;
  try {
    try { ctx = new AudioContext({ sampleRate: S.rate, latencyHint: 'playback' }); } catch (e) { ctx = new AudioContext(); } // 못 맞추면 링 버퍼가 비율대로 읽는다
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    await ctx.audioWorklet.addModule('worklet.js');
    node = new AudioWorkletNode(ctx, 'pcm', { numberOfInputs: 0, outputChannelCount: [2],
      processorOptions: { inRate: S.rate, bufferMs: S.clientBufferMs, maxBufferMs: S.clientMaxBufferMs } });
    node.connect(ctx.destination);
    node.port.onmessage = (e) => { stats = e.data; played = e.data.played; apply(); };
    await ctx.resume();
  } catch (e) {
    started = false;
    addChat({ sys: true, text: '소리를 켜지 못했어요(' + e + ')' });
    return;
  }
  wake();
  showLost(false);
  stream();
}
async function stream() {
  for (;;) {
    try {
      const r = await fetch('audio?k=' + encodeURIComponent(K), { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      startFrame = Number(r.headers.get('X-Start-Frame'));
      played = 0;
      node.port.postMessage({ reset: true });
      audioDown = false;
      const rd = r.body.getReader();
      for (;;) {
        const { value, done } = await rd.read();
        if (done) break;
        const b = value.byteOffset === 0 && value.byteLength === value.buffer.byteLength ? value.buffer : value.slice().buffer;
        node.port.postMessage(b, [b]);
      }
    } catch (e) {}
    audioDown = true;
    apply();
    await new Promise((ok) => setTimeout(ok, S.lostMs));
  }
}
let lock = null;
async function wake() {
  try { if (navigator.wakeLock && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') { wake(); ctx && ctx.resume(); } });
setInterval(() => {
  if (!started || !stats) return;
  fetch('stats?k=' + encodeURIComponent(K), { method: 'POST', body: JSON.stringify({ client: CID,
    bufferedMs: stats.buffered * 1000 / S.rate, underruns: stats.underruns, drops: stats.drops, played: stats.played, ua: navigator.userAgent }) }).catch(() => {});
}, S.clientStatsS * 1000);

// ---- 시작 ----
if (Q.get('test') === '1') {
  // 페이지 시험(RelayPageTest): 주소 # 뒤의 화면 요소·채팅을 그리고, 그린 결과를 #test-out에 JSON으로 쓴다
  const fx = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const out = { screens: [], settingsButton: !!document.querySelector('[aria-label="설정"]') };
  const css = (id, p) => getComputedStyle($(id))[p];
  for (const s of fx.screens) {
    showApp(s);
    out.screens.push({
      title: $('title').hidden ? null : $('titleText').textContent, titleColor: css('title', 'color'), dot: !$('dot').hidden,
      sub: $('sub').hidden ? null : $('sub').textContent, visual: cv.dataset.visual, az: cv.dataset.az, stop: cv.dataset.stop,
      guideHeight: $('guide').style.flexBasis,
      label: $('label').hidden ? null : $('label').textContent, labelSize: css('label', 'fontSize'), labelColor: css('label', 'color'),
      hints: $('hints').textContent, hintsVisible: css('hints', 'visibility') === 'visible', hintsBold: [...$('hints').querySelectorAll('b')].map((b) => b.textContent),
      notice: $('notice').hidden ? null : $('notice').textContent,
    });
  }
  for (const m of fx.chats) addChat(m);
  out.chatText = [...$('msgs').children].map((d) => d.textContent);
  out.chatElements = $('msgs').querySelectorAll('b, i, script, img').length;
  $('test-out').textContent = JSON.stringify(out);
} else {
  showStart();
  const es = new EventSource('events?k=' + encodeURIComponent(K));
  es.addEventListener('screen', (e) => onScreen(JSON.parse(e.data)));
  es.addEventListener('chat', (e) => addChat(JSON.parse(e.data)));
  es.onopen = () => { sseDown = false; apply(); };
  es.onerror = () => { sseDown = true; apply(); };
  $('screen').addEventListener('click', () => start());
  if (Q.get('autostart') === '1') start(); // 시험 실행용(브라우저를 자동 재생 허용으로 켰을 때)
}
</script>
</body>
</html>
