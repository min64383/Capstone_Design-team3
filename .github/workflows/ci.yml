# M41(A1 MA1): main에 들어가는 변경마다 README §5의 규칙(main은 :core:test 통과, 에이전트 지침 동기화)과 분석 도구 자체 점검을
# 사람이 기억하지 않아도 돌린다. 팀 개발 환경(Windows, PowerShell 5.1 스크립트, gradlew.bat)과 같게 Windows에서 돈다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/analysis/requirements.txt

      - name: 에이전트 지침 동기화 (README §4.7)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\setup\check-agent-docs.ps1

      - name: core·viewer 테스트
        shell: powershell
        run: .\gradlew.bat :core:test :viewer:test --no-daemon

      - name: 분석 도구 의존성 (requirements.txt 고정 버전)
        run: python -m pip install -r tools/analysis/requirements.txt

      # core 테스트가 쓴 합성 재생(core/build/test-output)을 읽는다
      - name: 분석 도구 자체 점검
        run: python tools/analysis/test_analysis.py
