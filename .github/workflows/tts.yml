name: TTS Android checks

on:
  push:
    branches: [1118tts]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'tools/tts-tests/**'
      - '*.gradle.kts'
      - '.github/workflows/tts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK-independent policy tests
        run: |
          chmod +x gradlew
          ./gradlew -p tools/tts-tests test --no-daemon
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK
        shell: bash
        run: |
          set +e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --verbose "platforms;android-37.0" > sdk-install.log 2>&1
          status=$?
          cat sdk-install.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('sdk-install.log').read_text(errors='replace')[-24000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android SDK installation::' + text)
          PY
          fi
          exit "$status"
      - name: Unit tests and debug build
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain > android-build.log 2>&1
          status=$?
          cat android-build.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('android-build.log').read_text(errors='replace')[-24000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build::' + text)
          PY
          fi
          exit "$status"
      - name: Save build diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-android-diagnostics
          path: |
            sdk-install.log
            android-build.log
            app/build/test-results/**
          retention-days: 7
