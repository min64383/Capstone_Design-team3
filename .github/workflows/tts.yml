name: TTS Android checks

on:
  push:
    branches: [1118tts]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/tts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"'
      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
